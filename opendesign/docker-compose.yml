services:
  open-design:
    image: ${OPEN_DESIGN_IMAGE:-docker.io/vanjayak/open-design:latest}
    container_name: stacksmith_open_design
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NODE_OPTIONS: ${NODE_OPTIONS:---max-old-space-size=192}
      OD_BIND_HOST: 0.0.0.0
      OD_ALLOWED_ORIGINS: ${OPEN_DESIGN_ALLOWED_ORIGINS:-}
      OD_PORT: 7456
      OD_WEB_PORT: 7456
      OD_API_TOKEN: ${OD_API_TOKEN:?Please run 'openssl rand -hex 32' to generate one, and set it in your .env file.}
      TZ: ${TZ}
    volumes:
      - open-design-data:/app/.od
    networks:
      - stacksmith
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    mem_limit: ${OPEN_DESIGN_MEM_LIMIT:-384m}
    pids_limit: 256
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:7456/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.open-design.rule=Host(`${OPEN_DESIGN_HOSTNAME}`)"
      - "traefik.http.routers.open-design.entrypoints=websecure-tailscale"
      - "traefik.http.routers.open-design.tls.certresolver=stacksmith"
      - "traefik.http.services.open-design.loadbalancer.server.port=7456"
      - "traefik.http.routers.open-design.middlewares=secure-headers@docker"

volumes:
  open-design-data:
    name: stacksmith_open_design_data

networks:
  stacksmith:
    external: true
