services:
  voicebox:
    image: ${VOICEBOX_IMAGE:-stacksmith_voicebox:latest}
    container_name: stacksmith_voicebox
    restart: unless-stopped
    environment:
      LOG_LEVEL: ${VOICEBOX_LOG_LEVEL:-info}
      HF_HOME: /app/data/cache/huggingface
      HUGGINGFACE_HUB_CACHE: /app/data/cache/huggingface/hub
      XDG_CACHE_HOME: /app/data/cache
      NUMBA_CACHE_DIR: /tmp/numba_cache
      TZ: ${TZ:-Europe/Zurich}
      VOICEBOX_CORS_ORIGINS: ${VOICEBOX_CORS_ORIGINS:-}
    volumes:
      - voicebox-data:/app/data
      - voicebox-generations:/app/data/generations
    networks:
      - stacksmith
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://127.0.0.1:17493/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "${VOICEBOX_CPU_LIMIT:-4}"
          memory: ${VOICEBOX_MEMORY_LIMIT:-16G}
        reservations:
          devices:
            - driver: nvidia
              count: ${VOICEBOX_NVIDIA_GPU_COUNT:-1}
              capabilities: [gpu]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.voicebox.rule=Host(`${VOICEBOX_HOSTNAME:?Set VOICEBOX_HOSTNAME to the routed hostname}`)"
      - "traefik.http.routers.voicebox.entrypoints=websecure-tailscale"
      - "traefik.http.routers.voicebox.tls.certresolver=stacksmith"
      - "traefik.http.services.voicebox.loadbalancer.server.port=17493"
      - "traefik.http.routers.voicebox.middlewares=secure-headers@docker"

  voicebox-openai-adapter:
    image: ${VOICEBOX_ADAPTER_IMAGE:-ghcr.io/michaelschmidle/voicebox-openai-adapter:0.1.0@sha256:2cfcc073be8febf62143972fbe7a6b1a1a56a77766ce4385897f598fc9f68eef}
    container_name: stacksmith_voicebox_openai_adapter
    restart: unless-stopped
    depends_on:
      voicebox:
        condition: service_healthy
    environment:
      ADAPTER_API_KEY: ${VOICEBOX_ADAPTER_API_KEY:?Set VOICEBOX_ADAPTER_API_KEY to a long random secret}
      VOICEBOX_BASE_URL: http://voicebox:17493
      VOICEBOX_CLIENT_ID: ${VOICEBOX_ADAPTER_CLIENT_ID:-openai-adapter}
      VOICEBOX_DEFAULT_ENGINE: ${VOICEBOX_ADAPTER_DEFAULT_ENGINE:-qwen}
      VOICEBOX_ALLOWED_ENGINES: ${VOICEBOX_ADAPTER_ALLOWED_ENGINES:-qwen,qwen_custom_voice,luxtts,chatterbox,chatterbox_turbo,tada,kokoro}
      VOICEBOX_REQUEST_TIMEOUT_SECONDS: ${VOICEBOX_ADAPTER_REQUEST_TIMEOUT_SECONDS:-600}
      VOICEBOX_HEALTH_TIMEOUT_SECONDS: ${VOICEBOX_ADAPTER_HEALTH_TIMEOUT_SECONDS:-5}
      MAX_INPUT_CHARS: ${VOICEBOX_ADAPTER_MAX_INPUT_CHARS:-4096}
      MAX_AUDIO_BYTES: ${VOICEBOX_ADAPTER_MAX_AUDIO_BYTES:-104857600}
      FFMPEG_TIMEOUT_SECONDS: ${VOICEBOX_ADAPTER_FFMPEG_TIMEOUT_SECONDS:-120}
      LOG_LEVEL: ${VOICEBOX_ADAPTER_LOG_LEVEL:-INFO}
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m,uid=10001,gid=10001
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - stacksmith
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2).read()
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.voicebox-openai-adapter.rule=Host(`${VOICEBOX_HOSTNAME:?Set VOICEBOX_HOSTNAME to the routed hostname}`) && PathPrefix(`/v1/audio/`)"
      - "traefik.http.routers.voicebox-openai-adapter.priority=100"
      - "traefik.http.routers.voicebox-openai-adapter.entrypoints=websecure-tailscale"
      - "traefik.http.routers.voicebox-openai-adapter.tls.certresolver=stacksmith"
      - "traefik.http.routers.voicebox-openai-adapter.middlewares=secure-headers@docker"
      - "traefik.http.routers.voicebox-openai-adapter.service=voicebox-openai-adapter"
      - "traefik.http.services.voicebox-openai-adapter.loadbalancer.server.port=8000"

volumes:
  voicebox-data:
    name: stacksmith_voicebox_data
  voicebox-generations:
    name: stacksmith_voicebox_generations

networks:
  stacksmith:
    external: true
