# Qwen3.6-35B-A3B-heretic NVFP4 + DFlash on DGX Spark / GB10
services:
  vllm:
    image: ${QWEN36_VLLM_IMAGE:-ghcr.io/aeon-7/vllm-spark-omni-q36:v1.2}
    container_name: stacksmith_vllm_gb10_qwen_3_6
    restart: unless-stopped
    environment:
      VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
      TORCH_MATMUL_PRECISION: high
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
      NVIDIA_FORWARD_COMPAT: "1"
      VLLM_TEST_FORCE_FP8_MARLIN: "1"
      VLLM_SPECULATIVE_CONFIG: ${VLLM_SPECULATIVE_CONFIG:-{"method":"dflash","model":"/models/qwen36-dflash","num_speculative_tokens":15}}
    volumes:
      - ${QWEN36_MODELS_DIR:?Set QWEN36_MODELS_DIR to the host directory containing qwen36-nvfp4 and qwen36-dflash}/qwen36-nvfp4:/models/qwen36:ro
      - ${QWEN36_MODELS_DIR:?Set QWEN36_MODELS_DIR to the host directory containing qwen36-nvfp4 and qwen36-dflash}/qwen36-dflash:/models/qwen36-dflash:ro
    command:
      - bash
      - -c
      - |
        exec vllm serve /models/qwen36 \
          --served-model-name ${QWEN36_SERVED_MODEL_NAMES:-qwen36-35b-heretic qwen36-fast qwen36-deep} \
          --host ${VLLM_HOST:-0.0.0.0} --port ${VLLM_PORT:-8000} \
          --tensor-parallel-size ${VLLM_TENSOR_PARALLEL_SIZE:-1} \
          --dtype ${VLLM_DTYPE:-auto} \
          --quantization ${VLLM_QUANTIZATION:-compressed-tensors} \
          --max-model-len ${VLLM_MAX_MODEL_LEN:-262144} \
          --max-num-seqs ${VLLM_MAX_NUM_SEQS:-128} \
          --max-num-batched-tokens ${VLLM_MAX_NUM_BATCHED_TOKENS:-65536} \
          --gpu-memory-utilization ${VLLM_GPU_MEMORY_UTILIZATION:-0.85} \
          --enable-chunked-prefill \
          --enable-prefix-caching \
          --load-format safetensors \
          --trust-remote-code \
          --enable-auto-tool-choice \
          --tool-call-parser qwen3_coder \
          --reasoning-parser qwen3 \
          --speculative-config "$$VLLM_SPECULATIVE_CONFIG" \
          --attention-backend ${VLLM_ATTENTION_BACKEND:-flash_attn}
    ipc: host
    networks:
      - stacksmith
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.vllm-gb10-qwen-3-6.rule=Host(`${VLLM_HOSTNAME:?Set VLLM_HOSTNAME to the routed hostname}`)"
      - "traefik.http.routers.vllm-gb10-qwen-3-6.entrypoints=websecure-tailscale"
      - "traefik.http.routers.vllm-gb10-qwen-3-6.tls.certresolver=stacksmith"
      - "traefik.http.services.vllm-gb10-qwen-3-6.loadbalancer.server.port=8000"
      - "traefik.http.routers.vllm-gb10-qwen-3-6.middlewares=secure-headers@docker"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${VLLM_NVIDIA_GPU_COUNT:-all}
              capabilities: [gpu]

networks:
  stacksmith:
    external: true
