services:
  paperless:
    image: ghcr.io/paperless-ngx/paperless-ngx:3.1.3
    container_name: stacksmith_paperless
    restart: unless-stopped
    depends_on:
      paperless-db:
        condition: service_healthy
      paperless-redis:
        condition: service_healthy
    environment:
      PAPERLESS_URL: https://${PAPERLESS_HOSTNAME:?Set PAPERLESS_HOSTNAME}
      PAPERLESS_SECRET_KEY: ${PAPERLESS_SECRET_KEY:?Set a unique PAPERLESS_SECRET_KEY}
      PAPERLESS_DBENGINE: postgresql
      PAPERLESS_DBHOST: paperless-db
      PAPERLESS_DBNAME: paperless
      PAPERLESS_DBUSER: paperless
      PAPERLESS_DBPASS: ${PAPERLESS_DB_PASSWORD:?Set PAPERLESS_DB_PASSWORD}
      PAPERLESS_REDIS: redis://paperless-redis:6379
      PAPERLESS_TIME_ZONE: ${TZ:-Europe/Zurich}
      PAPERLESS_OCR_LANGUAGE: deu+eng
      PAPERLESS_OCR_MODE: skip
      PAPERLESS_CONSUMER_POLLING_INTERVAL: ${PAPERLESS_CONSUMER_POLLING_INTERVAL:-10}
      USERMAP_UID: ${PAPERLESS_UID:-1000}
      USERMAP_GID: ${PAPERLESS_GID:-1000}
    volumes:
      - paperless-data:/usr/src/paperless/data
      - paperless-media:/usr/src/paperless/media
      - type: bind
        source: ${PAPERLESS_CONSUME_DIR:?Set an absolute PAPERLESS_CONSUME_DIR}
        target: /usr/src/paperless/consume
        bind:
          create_host_path: false
      - type: bind
        source: ${PAPERLESS_EXPORT_DIR:?Set an absolute PAPERLESS_EXPORT_DIR}
        target: /usr/src/paperless/export
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "10", "http://localhost:8000/"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 120s
    networks:
      - stacksmith
      - paperless-backend
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=stacksmith"
      - "traefik.http.routers.paperless.rule=Host(`${PAPERLESS_HOSTNAME:?Set PAPERLESS_HOSTNAME}`)"
      - "traefik.http.routers.paperless.entrypoints=websecure-tailscale"
      - "traefik.http.routers.paperless.tls.certresolver=stacksmith"
      - "traefik.http.routers.paperless.middlewares=secure-headers@docker"
      - "traefik.http.services.paperless.loadbalancer.server.port=8000"

  paperless-db:
    image: postgres:17.11-alpine
    container_name: stacksmith_paperless_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: paperless
      POSTGRES_USER: paperless
      POSTGRES_PASSWORD: ${PAPERLESS_DB_PASSWORD:?Set PAPERLESS_DB_PASSWORD}
    volumes:
      - paperless-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperless -d paperless"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - paperless-backend
    labels:
      - "traefik.enable=false"

  paperless-redis:
    image: redis:8.2.9-alpine
    container_name: stacksmith_paperless_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - paperless-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - paperless-backend
    labels:
      - "traefik.enable=false"

volumes:
  paperless-data:
    name: stacksmith_paperless_data
  paperless-media:
    name: stacksmith_paperless_media
  paperless-db:
    name: stacksmith_paperless_db
  paperless-redis:
    name: stacksmith_paperless_redis

networks:
  stacksmith:
    external: true
  paperless-backend:
    internal: true
